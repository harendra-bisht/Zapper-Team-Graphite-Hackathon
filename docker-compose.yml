version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: certishield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: certishield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: certishield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/certishield
      USE_SQLITE_FALLBACK: "false"
      JWT_SECRET: certishield-graphite26-production-secret-key-32chars
    depends_on:
      - db

volumes:
  pgdata:
